# Build-approval policy for pnpm 11 (allowBuilds). This same pnpm runs both
# on dev machines and in the Docker image (corepack), and it only honors
# allowBuilds — not onlyBuiltDependencies/ignoredBuiltDependencies. The file
# must be COPY'd into the build stage before `pnpm install` (see Dockerfile).
allowBuilds:
  '@prisma/engines': false
  esbuild: true
  prisma: false
